<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftPay | Next-Gen VTU Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
       <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <style>
        :root {                                                                                                                                                   
            --primary-color: #4F46E5; /* Indigo */
            --secondary-color: #0EA5E9; /* Sky Blue */
            --accent-gold: #F59E0B;
            --dark-bg: #0F172A;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #ffffff;
            color: #1e293b;
        }

        /* Navbar Styling */
        .navbar {
            background: rgba(255, 255, 255, 0.8) !important;
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        /* Hero Section */
        .hero-gradient {
            background: radial-gradient(circle at top right, #eef2ff 0%, #ffffff 50%);
            padding: 120px 0 80px 0;
        }

        .hero-badge {
            background: #EEF2FF;
            color: var(--primary-color);
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-block;
        }

        /* Premium Form Card */
        .vtu-form-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
            border: 1px solid rgba(0,0,0,0.03);
            padding: 40px;
        }

        .form-control, .form-select {
            border: 2px solid #f1f5f9;
            padding: 12px 15px;
            border-radius: 12px;
            font-weight: 500;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: none;
        }

        /* Service Cards */
        .service-card {
            border: none;
            border-radius: 20px;
            padding: 30px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: #f8fafc;
        }

        .service-card:hover {
            background: #ffffff;
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
        }

        .icon-box {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        /* Stats Section */
        .stats-section {
            background: var(--dark-bg);
            color: white;
            border-radius: 30px;
            padding: 60px 0;
            margin-top: -50px;
        }

        .btn-primary-premium {
            background: var(--primary-color);
            border: none;
            padding: 14px 30px;
            border-radius: 12px;
            font-weight: 700;
            transition: 0.3s;
        }

        .btn-primary-premium:hover {
            background: #4338ca;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top py-3">
        <div class="container">
            <a class="navbar-brand fw-bolder fs-4 text-primary" href="#">SWIFTPAY.</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto gap-lg-3 fw-semibold">
                    <li class="nav-item"><a class="nav-link" href="#">Data</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Airtime</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Utility</a></li>
                    <li class="nav-item ms-lg-4"><a class="btn btn-light rounded-pill px-4 border" href="#">Sign In</a></li>
                    <li class="nav-item"><a class="btn btn-primary-premium rounded-pill px-4 text-white" href="#">Register</a></li>
                </ul>
            </div>
        </div>
    </nav>



<style>
    /* Registration Specific Styles */
    .register-wrapper {
        min-height: 100vh;
        background: #F8FAFC;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 10px;
    }

    .register-card {
        background: #ffffff;
        width: 100%;
        max-width: 550px;
        border-radius: 32px;
        padding: 20px;
        border: 1px solid rgba(0,0,0,0.04);
        box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.08);
    }

    /* Progress Dots */
    .step-indicator {
        display: flex;
        gap: 8px;
        margin-bottom: 30px;
    }

    .step-dot {
        height: 6px;
        flex-grow: 1;
        background: #E2E8F0;
        border-radius: 10px;
        transition: 0.4s;
    }

    .step-dot.active {
        background: var(--primary-color);
        box-shadow: 0 0 10px rgba(79, 70, 229, 0.3);
    }

    /* Input Enhancements */
    .reg-label {
        font-size: 0.75rem;
        font-weight: 800;
        color: #64748B;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
        display: block;
    }

    .reg-input {
        background: #F8FAFC;
        border: 2px solid #F1F5F9;
        border-radius: 16px;
        padding: 14px 20px;
        font-weight: 600;
        width: 100%;
        margin-bottom: 20px;
        transition: 0.3s;
    }

    .reg-input:focus {
        background: white;
        border-color: var(--primary-color);
        outline: none;
        box-shadow: 0 10px 20px rgba(79, 70, 229, 0.05);
    }

    /* Benefit Tags */
    .benefit-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #F1F5F9;
        padding: 6px 12px;
        border-radius: 50px;
        font-size: 0.7rem;
        font-weight: 800;
        color: #475569;
        margin-right: 8px;
        margin-bottom: 8px;
    }

    .benefit-tag i { color: var(--primary-color); }

</style>

<div class="register-wrapper" style="margin-top: 100px;">
    <div class="register-card">
        <div class="text-center mb-4">
            <h2 class="fw-800 text-primary mb-1">Fly.</h2>
            <p class="x-small fw-bold text-muted ls-1">CREATE YOUR EXECUTIVE ACCOUNT</p>
        </div>

        <div class="step-indicator">
            <div class="step-dot active"></div>
            <div class="step-dot"></div>
            <div class="step-dot"></div>
        </div>

        <div id="step-1">
            <div class="mb-4">
                <h4 class="fw-800">Let's get started</h4>
                <p class="text-muted small fw-bold">Enter your basic details to secure your spot.</p>
            </div>

            <div class="row g-2">
                <div class="col-md-6">
                    <label class="reg-label">First Name</label>
                    <input type="text" class="reg-input" placeholder="e.g. Adewale">
                </div>
                <div class="col-md-6">
                    <label class="reg-label">Last Name</label>
                    <input type="text" class="reg-input" placeholder="e.g. John">
                </div>
            </div>

            <label class="reg-label">Email Address</label>
            <input type="email" class="reg-input" placeholder="alex@example.com">

            <label class="reg-label">Phone Number (WhatsApp Preferred)</label>
            <div class="input-group mb-4">
                <span class="input-group-text border-0 bg-light fw-bold" style="border-radius: 16px 0 0 16px;">+234</span>
                <input type="tel" class="form-control reg-input mb-0" placeholder="810 000 0000" style="border-radius: 0 16px 16px 0;">
            </div>

            <button class="btn btn-primary w-100 py-3 rounded-4 fw-800 shadow-sm" onclick="nextStep(2)">
                Continue to Security
            </button>
        </div>

        <div class="mt-5 pt-4 border-top text-center">
            <div class="d-flex flex-wrap justify-content-center mb-3">
                <span class="benefit-tag"><i class="bi bi-shield-check"></i> NDIC Insured</span>
                <span class="benefit-tag"><i class="bi bi-lightning"></i> 2s Settlement</span>
                <span class="benefit-tag"><i class="bi bi-headset"></i> 24/7 Support</span>
            </div>
            <p class="small fw-bold text-muted">
                Already have an account? <a href="#" class="text-primary text-decoration-none fw-800">Sign In</a>
            </p>
        </div>
    </div>
</div>

<script>
    // Simple logic to show step-by-step flow (You can expand this with your backend)
    function nextStep(step) {
        // This is where you would validate the current inputs 
        // and trigger the next section of the form via JavaScript.
        console.log("Moving to step " + step);
        // Alerting for demo purposes
        alert("In a real app, this would slide to the Password & KYC step!");
    }
</script>
